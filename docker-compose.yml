version: '3.9'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npx nodemon index.js

  client:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - server
